<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>m</title>
  <!--
    Lowercase "m": one stem plus two arches, drawn as a stroked path with
    square caps so it stays legible down to 16x16. Geometry is centred on the
    128x128 box: stroke 16, outer edges at x=20/108, cap height y=36..100.
  -->
  <path
    d="M28 100V44m0 8c0-10 7-16 18-16s18 6 18 16v48m0-48c0-10 7-16 18-16s18 6 18 16v48"
    fill="none"
    stroke="#000"
    stroke-width="16"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
  <style>
  path {
    stroke: #000;
  }
  @media (prefers-color-scheme: dark) {
    path {
      stroke: #fff;
    }
  }
  </style>
</svg>
